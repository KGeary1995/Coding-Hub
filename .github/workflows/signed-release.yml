name: Signed Windows release verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      CODING_HUB_BASELINE_VERSION: '1.6.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - name: Verify signing configuration is present
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:WINDOWS_PUBLISHER_NAME) { throw 'Configure signing secrets and the public publisher name in repository settings.' }
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run test:enterprise
      - run: npm run test:productivity
      - run: npm run test:models-stability
      - run: npm run dist:win:signed
      # Installs from before the rename used the old name; test:install looks for that installer and executable.
      - name: Build signed upgrade baseline
        run: node scripts/build-windows.cjs --signed --output release/baseline --version ${{ env.CODING_HUB_BASELINE_VERSION }}
        env:
          TRACE_LEGACY_PRODUCT_NAME: '1'
      - run: npm run test:install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Coding-Hub-Signed-Windows
          if-no-files-found: error
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/*-Portable.exe
            release/latest.yml
            release/windows-signature-report.json
            release/windows-install-report.json
