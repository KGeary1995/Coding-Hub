name: Release a new version on main
# Merging a pull request that raises package.json's version is the decision to release it; the steps after that were
# done by hand (start the Windows release candidate, wait, tag). This does them, in one job: once CI passes on main's
# newest commit and that version is not on the downloads page yet, it starts Windows release candidate, waits for it,
# and then starts Release with publish (which builds, refuses a commit the candidate has not passed on, and never
# replaces a published version).
# One job that waits, because a run this workflow starts raises no event of its own when it ends: with 1.27.0 the
# candidate was started and passed, and nothing started Release (2026-11-22).
# A merge that does not raise the version starts nothing. If main moves on meanwhile, nothing is published for the older
# commit; the newer one goes through the same steps. Doing the steps by hand still works (docs/windows-releases.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: auto-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # The candidate takes about 20 minutes, and one rerun of a timed-out job fits.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Start the Windows release candidate, wait for it, then start Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          newest() { gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha; }
          if [ "$(newest)" != "$SHA" ]; then echo "main has moved on from $SHA; its newest commit goes through these steps itself."; exit 0; fi
          if gh release view "v$version" --repo KGeary1995/trace-releases >/dev/null 2>&1; then echo "Trace $version is already on the downloads page: nothing to release."; exit 0; fi
          passed() { gh run list --workflow windows-release.yml --commit "$SHA" --status success --limit 1 --json databaseId --jq 'length'; }
          if [ "$(passed)" != 1 ]; then
            echo "CI passed on $SHA and Trace $version is not published: starting the Windows release candidate."
            gh workflow run windows-release.yml --ref main
            run=""
            for attempt in $(seq 1 30); do
              sleep 10
              run=$(gh run list --workflow windows-release.yml --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run" ] && break
            done
            if [ -z "$run" ]; then echo "::error::The Windows release candidate did not start on $SHA."; exit 1; fi
            echo "Waiting for run $run."
            if ! gh run watch "$run" --exit-status --interval 60 >/dev/null; then
              echo "It failed once; Windows runners sometimes time out in heavy tests, so its failed jobs are run again, once."
              gh run rerun "$run" --failed; sleep 30
              gh run watch "$run" --exit-status --interval 60 >/dev/null || { echo "::error::The Windows release candidate failed twice on $SHA. Nothing is published."; exit 1; }
            fi
          fi
          # The run list can take a while to show a run that has just finished (1.30.2's candidate passed at 06:42:27 and
          # was not listed 18 seconds later), so it is asked again for up to two minutes.
          for attempt in $(seq 1 12); do [ "$(passed)" = 1 ] && break; sleep 10; done
          if [ "$(passed)" != 1 ]; then echo "::error::No successful Windows release candidate on $SHA."; exit 1; fi
          if [ "$(newest)" != "$SHA" ]; then echo "main moved on while the candidate ran; nothing is published for $SHA."; exit 0; fi
          if [ "$(gh run list --workflow release.yml --commit "$SHA" --json databaseId --jq 'length')" != 0 ]; then echo "Release has already been started on $SHA."; exit 0; fi
          echo "The Windows release candidate passed on $SHA: starting Release for Trace $version."
          gh workflow run release.yml --ref main -f publish=true
