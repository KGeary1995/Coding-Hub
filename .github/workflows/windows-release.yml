name: Windows release candidate
# About 16 billed minutes a run (Windows minutes count double on a private repository), and in October 2026 it ran on
# every pull request push and every merge, about 200 times. So it runs:
# - nightly, on main, only when main has a commit this workflow hasn't passed on yet (the `changed` job);
# - on pull requests labeled `windows`, for a change worth checking on Windows before it merges;
# - by hand (Run workflow), which is the step before tagging a release (docs/windows-releases.md).
# ci.yml still runs the tests on Linux for every pull request push.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC, overnight in the US
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Scheduled runs only: has this workflow already passed on main's head (nightly or by hand)?
  changed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow windows-release.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "main is at $GITHUB_SHA; last passed at ${passed:-nothing}"
          if [ "$passed" = "$GITHUB_SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
  windows:
    needs: changed
    # always(): `changed` is skipped on everything but the nightly run, and a skipped need would skip this job too.
    if: >-
      always() && (
        (github.event_name == 'schedule' && needs.changed.outputs.run == 'true') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          contains(github.event.pull_request.labels.*.name, 'windows'))
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run test:desktop
      - run: npm run test:design
      - run: npm run test:profiles
      - run: npm run test:workbench
      - run: npm run test:enterprise
      - run: npm run test:productivity
      - run: npm run test:models-stability
      # Windows-only: Ctrl+V and Alt+V image/text paste against the real system clipboard (the build above is current).
      - run: node scripts/paste-smoke.cjs
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # The baseline installs under the app's old name (AI Coding Hub), so the test covers upgrading to Trace.
      - name: Build upgrade baseline (same source, previous package version and name)
        run: node scripts/build-windows.cjs --output release/baseline --version 1.2.0
        env:
          TRACE_LEGACY_PRODUCT_NAME: '1'
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: npm run test:install
      # Installers are about 230 MB; keep them for main and manual runs, not every pull request push.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Coding-Hub-Windows-${{ github.run_number }}
          if-no-files-found: error
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/*-Portable.exe
            release/latest.yml
            release/windows-install-report.json
      - name: Upload installation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-install-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          path: release/windows-install-report.json
