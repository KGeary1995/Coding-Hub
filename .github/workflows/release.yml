name: Release
# Pushing a tag v<version> (matching package.json) builds the Windows installer and the Mac disk images, checks that
# the Mac app starts a CLI (windows-release.yml, run by hand on main before tagging, tests the Windows installer), and publishes them on
# the public downloads repository KGeary1995/trace-releases, which installed copies check for updates. A manual run
# builds and tests; on main with "publish" ticked it also publishes, as v<package.json version>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish on the downloads page as v<package.json version> (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/*-Portable.exe
            release/latest.yml
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run test:pty
      # With the Developer ID secrets (docs/windows-releases.md), the apps are signed and notarized, and the zips and
      # latest-mac.yml that installed Macs update themselves from are built too. Without them, ad-hoc disk images only.
      - name: Sign with the Developer ID
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then echo "::warning::No MAC_CERTIFICATE secret: the Mac apps are ad-hoc signed and cannot update themselves."; exit 0; fi
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::MAC_CERTIFICATE is set but APPLE_API_KEY is not: a signed app must also be notarized."; exit 1; fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          { echo "MAC_SIGNING_IDENTITY=Kyle Geary (73DB29GHV2)"; echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
      - run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Start a CLI in the packaged app (Apple silicon)
        run: node scripts/packaged-smoke.cjs "release/mac/mac-arm64/Trace.app/Contents/MacOS/Trace"
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            release/mac/*.dmg
            release/mac/*.zip
            release/mac/*.zip.blockmap
            release/mac/latest-mac.yml
  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not "assets": that folder in the checkout holds the app icons and entitlements, which would be published too.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish on the downloads repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the RELEASES_TOKEN secret: a token that can write to KGeary1995/trace-releases (see docs/windows-releases.md)."; exit 1; fi
          # A tag names the release; a manual run on main takes the version from package.json. An existing release is never replaced.
          tag="$GITHUB_REF_NAME"; [ "$GITHUB_REF_TYPE" = tag ] || tag="v$(node -p "require('./package.json').version")"
          ls -l release-assets
          gh release create "$tag" --repo KGeary1995/trace-releases --title "Trace ${tag#v}" --notes-file docs/RELEASE_NOTES.md release-assets/*
