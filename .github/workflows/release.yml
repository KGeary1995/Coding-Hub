name: Release
# Pushing a tag v<version> (matching package.json) builds the Windows installer and the Mac disk images, checks that
# the Mac app starts a CLI, and publishes them on the public downloads repository KGeary1995/trace-releases, which
# installed copies check for updates. windows-release.yml, run by hand on main before tagging, installs and starts the
# Windows build; publish refuses a commit it has not passed on. A manual run builds and tests; on main with "publish"
# ticked it also publishes, as v<package.json version>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish on the downloads page as v<package.json version> (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Check for the Windows signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "::warning::No WINDOWS_CERTIFICATE secret: the Windows installer and app are not code-signed, so installed copies accept an update on the feed's checksum alone (docs/windows-releases.md)."; fi
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Signed builds name their publisher, so installed copies check who signed each update before running it.
          # Only with a certificate: an unsigned installer checked against a publisher name would never install.
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_CERTIFICATE != '' && vars.WINDOWS_PUBLISHER_NAME || '' }}
      # The price list and model names this version was built with, for installed copies to refresh from between releases.
      - run: node scripts/make-catalog.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/*-Portable.exe
            release/latest.yml
            release/catalog.json
  mac:
    runs-on: macos-latest
    # Notarizing two disk images waits on Apple, so this one gets longer.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run test:pty
      # With the Developer ID secrets (docs/windows-releases.md), the apps are signed and notarized, and installed Macs
      # update themselves from the zips in latest-mac.yml. Without them the apps are ad-hoc signed; the zips are still
      # built and listed, for Trace 1.21.0's update from another computer.
      - name: Sign with the Developer ID
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then echo "::warning::No MAC_CERTIFICATE secret: the Mac apps are ad-hoc signed and cannot update themselves."; exit 0; fi
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::MAC_CERTIFICATE is set but APPLE_API_KEY is not: a signed app must also be notarized."; exit 1; fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          # CSC_LINK only when there is a certificate: set but empty, electron-builder takes it as a path and fails.
          { echo "MAC_SIGNING_IDENTITY=Kyle Geary (73DB29GHV2)"; echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; echo "CSC_LINK=$RUNNER_TEMP/certificate.p12"; echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"; } >> "$GITHUB_ENV"
      - run: npm run dist:mac
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Start a CLI in the packaged app (Apple silicon)
        run: node scripts/packaged-smoke.cjs "release/mac/mac-arm64/Trace.app/Contents/MacOS/Trace"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            release/mac/*.dmg
            release/mac/*.zip
            release/mac/*.zip.blockmap
            release/mac/latest-mac.yml
  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # The published Setup.exe is never started here: windows-release.yml installs and starts a build of the same commit.
      # A rerun of this job (gh run rerun <id> --failed) after the candidate passes publishes without building again.
      - name: Check the Windows release candidate passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow windows-release.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq 'length')
          if [ "$passed" != 1 ]; then echo "::error::No successful Windows release candidate run on $GITHUB_SHA. Start it (gh workflow run windows-release.yml --ref main), wait for it to pass on this commit, then rerun this job."; exit 1; fi
          echo "The Windows release candidate passed on $GITHUB_SHA."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not "assets": that folder in the checkout holds the app icons and entitlements, which would be published too.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish on the downloads repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the RELEASES_TOKEN secret: a token that can write to KGeary1995/trace-releases (see docs/windows-releases.md)."; exit 1; fi
          # A tag names the release; a manual run on main takes the version from package.json. An existing release is never replaced.
          tag="$GITHUB_REF_NAME"; [ "$GITHUB_REF_TYPE" = tag ] || tag="v$(node -p "require('./package.json').version")"
          ls -l release-assets
          # GitHub refuses a description over 125,000 characters: the newest versions' notes that fit, then Install.
          node scripts/release-notes.cjs docs/RELEASE_NOTES.md "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo KGeary1995/trace-releases --title "Trace ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md" release-assets/*
