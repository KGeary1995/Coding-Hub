name: CI
# Fast checks on every pull request push. The full Windows build and install test is in windows-release.yml, which runs
# nightly when main changed, on pull requests labeled `windows`, and by hand.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hosted Linux runners have no user namespace sandbox for Electron.
      CODING_HUB_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      # `npm run build` includes the type checks; the smoke scripts below reuse its output.
      - run: npm run build
      - name: Desktop smoke tests (fixture CLIs, virtual display)
        run: |
          for test in desktop design profiles workbench enterprise productivity models-stability remote table-seats screen runner-desktop; do
            echo "::group::$test"
            xvfb-run -a node "scripts/$test-smoke.cjs"
            echo "::endgroup::"
          done
      # They run Electron as Node, so they need no display: the memory MCP server over stdio, real PTYs, and the background
      # runner holding a real terminal while nothing is connected.
      - name: Memory server, real PTY and runner checks
        run: |
          node scripts/memory-smoke.cjs
          node scripts/channel-tools-smoke.cjs
          node scripts/run-pty-smoke.cjs
          node scripts/runner-smoke.cjs
