name: CI
# Fast checks on every pull request push. The full Windows build and install test is in windows-release.yml, which runs
# nightly when main changed, on pull requests labeled `windows`, and by hand.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hosted Linux runners have no user namespace sandbox for Electron.
      CODING_HUB_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      # `npm run build` includes the type checks; the smoke scripts below reuse its output.
      - run: npm run build
      - name: Desktop smoke tests (fixture CLIs, virtual display)
        run: |
          for test in desktop design profiles workbench enterprise productivity models-stability remote table-seats screen; do
            echo "::group::$test"
            xvfb-run -a node "scripts/$test-smoke.cjs"
            echo "::endgroup::"
          done
      # Both run Electron as Node, so they need no display: the memory MCP server over stdio, and real PTYs.
      - name: Memory server and real PTY checks
        run: |
          node scripts/memory-smoke.cjs
          node scripts/channel-tools-smoke.cjs
          node scripts/run-pty-smoke.cjs
