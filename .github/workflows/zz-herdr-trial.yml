# Temporary (feat/herdr-core-trial only): the herdr-core trial's test on Windows. Removed before the branch's pull request.
name: herdr-core trial
on:
  push:
    branches: [feat/herdr-core-trial]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
      - run: npm ci
      - name: Install herdr-core into the runner's temp folder
        shell: pwsh
        run: |
          $env:HC_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'hc'
          irm https://releases.herdr.dev/core/install.ps1 | iex
          & (Join-Path $env:HC_INSTALL_DIR 'herdr-core.exe') --version
          "CODING_HUB_TEST_HC=$(Join-Path $env:HC_INSTALL_DIR 'herdr-core.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: npx vitest run electron/services/runner/herdr.test.ts
